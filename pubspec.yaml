name: winget_gui
description: A new Flutter project.

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: ^4.12.0
  system_theme: ^3.1.2
  window_manager: ^0.5.1
  flutter_acrylic: ^1.1.4
  url_launcher: ^6.3.2
  expandable_text: ^2.3.0
  intl: any
  open_store: ^0.5.0
  favicon: ^1.1.2
  flutter_svg: ^2.2.1
  http: ^1.5.0
  gallery_image_viewer: ^1.2.0
  yaml: ^3.1.3
  flutter_localized_locales: ^2.0.5
  collection: any
  internet_connection_checker: ^3.0.1
  fluentui_system_icons: ^1.1.273
  provider: ^6.1.5+1
  dart_casing: ^3.0.1
  cron: ^0.6.2
  cached_network_image: ^3.4.1
  file_picker: ^10.3.2
  persistent_storage_interface:
    path: local_packages/persistent_storage/interface
  isar_persistent_storage:
    path: local_packages/persistent_storage/isar_storage
  winget_core:
    path: local_packages/winget_core
  logging: ^1.3.0
  async: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.6.0
  dependency_validator: ^5.0.2
  flutter_lints: ^6.0.0
  msix: ^3.16.12
  json_serializable: ^6.11.0
  ribs_json: ^1.0.0-dev.14
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

msix_config:
  display_name: WingetGUI
  publisher_display_name: Wi42
  publisher: CN=Wi42, O=Wi42, C=Switzerland
  identity_name: wi42.winget-gui
  msix_version: 0.0.0.4
  capabilities: internetClient
  architecture: x64
  certificate_path: "<path to your pfx file>"
  certificate_password: "<password for your pfx file>"
  logo_path: "assets/wingetGUI-logo-larger.png"