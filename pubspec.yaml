name: winget_gui
description: A new Flutter project.

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: ^4.11.2
  system_theme: ^3.1.2
  window_manager: ^0.4.3
  flutter_acrylic: ^1.1.4
  url_launcher: ^6.3.1
  expandable_text: ^2.3.0
  string_validator: ^1.1.0
  intl: any
  open_store: ^0.5.0
  favicon: ^1.1.2
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.2
  #shared_preferences_linux: 2.4.0 # needed because with 2.4.0 it crashes because source file is not found
  ribs_json: ^1.0.0-dev.14
  ribs_core: ^1.0.0-dev.13
  http: ^1.3.0
  gallery_image_viewer: ^1.2.0
  yaml: ^3.1.3
  flutter_localized_locales: ^2.0.5
  collection: any
  internet_connection_checker: ^3.0.1
  fluentui_system_icons: ^1.1.273
  provider: ^6.1.2
  dart_casing: ^3.0.1
  cron: ^0.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  sqflite_common_ffi: any
  diacritic: ^0.1.6
  cached_network_image: ^3.4.1
  file_picker: ^9.2.1
  # ----- isar -----
  # Using the isar-community.dev because the official isar package is not updated
  isar:
    hosted:
      name: isar
      url: https://pub.isar-community.dev/
    version: ^3.1.8
  isar_flutter_libs:
    hosted:
      name: isar_flutter_libs
      url: https://pub.isar-community.dev/
    version: ^3.1.8
  path_provider: ^2.1.5
  #path_provider_linux: 2.2.0 # needed because of isar build_runner
    # ----- \isar -----
  #isar_key_value:
  #  git: https://github.com/Wii42/isar_key_value_fork
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator:
    hosted:
      name: isar_generator
      url: https://pub.isar-community.dev/
    version: ^3.0.0
  build_runner: ^2.4.15
  dependency_validator: ^4.1.1
  flutter_lints: ^5.0.0
  msix: ^3.16.8
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

msix_config:
  display_name: WingetGUI
  publisher_display_name: Wi42
  publisher: CN=Wi42, O=Wi42, C=Switzerland
  identity_name: wi42.winget-gui
  msix_version: 0.0.0.1
  capabilities: internetClient
  architecture: x64